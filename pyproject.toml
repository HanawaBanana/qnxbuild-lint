[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qnxbuild-lint"
version = "0.1.0"
description = "Static checks for QNX mkifs buildfiles and recursive Makefiles"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "qnxbuild-lint contributors" }]
keywords = ["qnx", "mkifs", "bsp", "lint", "embedded"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
qnxbuild-lint = "qnxbuild_lint.cli:main"

[project.urls]
Homepage = "https://github.com/hanawabanana/qnxbuild-lint"

[tool.setuptools]
packages = ["qnxbuild_lint"]
